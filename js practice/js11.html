<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function outer() {
            let count = 0;

            function inner() {
                count++;
                console.log(count);
            }

            return inner;
        }

        let counter = outer();
        counter();        // 1
        counter();        // 2
        counter();        // 3

    </script>
</body>
</html>
